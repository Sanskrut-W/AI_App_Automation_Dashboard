<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>How it works — Mobile Test Automation</title>
<style>
  @page { size: A4 landscape; margin: 0; }

  :root {
    --ink: #16202c;
    --ink-soft: #55636f;
    --line: #dde4ec;
    --person: #1f6feb;
    --auto: #1a7f4b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Segoe UI", -apple-system, system-ui, sans-serif;
    color: var(--ink);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .sheet {
    width: 297mm;
    height: 210mm;
    padding: 12mm 14mm;
    display: flex;
    flex-direction: column;
  }

  h1 { font-size: 23pt; margin: 0 0 2pt; letter-spacing: -0.3pt; }
  .sub { font-size: 11.5pt; color: var(--ink-soft); margin: 0; }

  .head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 4mm; }

  .legend { display: flex; gap: 14pt; font-size: 10pt; color: var(--ink-soft); }
  .legend span { display: flex; align-items: center; gap: 6pt; }
  .swatch { width: 11pt; height: 11pt; border-radius: 3pt; display: inline-block; }
  .swatch.person { background: var(--person); }
  .swatch.auto { background: var(--auto); }

  .stage { flex: 1; display: flex; align-items: center; }
  svg { width: 100%; height: auto; }

  .foot {
    font-size: 9.5pt;
    color: var(--ink-soft);
    border-top: 1px solid var(--line);
    padding-top: 6pt;
  }
</style>
</head>
<body>

<section class="sheet">

  <div class="head">
    <div>
      <h1>How it works</h1>
      <p class="sub">From an app on a phone, to tested software with the evidence to prove it.</p>
    </div>
    <div class="legend">
      <span><i class="swatch person"></i> A person does this</span>
      <span><i class="swatch auto"></i> Happens automatically</span>
    </div>
  </div>

  <div class="stage">
    <svg viewBox="0 0 1160 510" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-label="Six-stage flow in two rows: connect a phone, it explores itself, a map is built; then tests are created either automatically or from a written journey, tests run on one or more phones, and a report is produced.">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#aab6c4" />
        </marker>
        <style>
          .box  { fill: #fff; stroke: #dde4ec; stroke-width: 1.6; }
          .num  { font: 700 16px "Segoe UI", sans-serif; fill: #fff; text-anchor: middle; }
          .ttl  { font: 700 20px "Segoe UI", sans-serif; fill: #16202c; text-anchor: middle; }
          .cap  { font: 14px "Segoe UI", sans-serif; fill: #55636f; text-anchor: middle; }
          .conn { stroke: #aab6c4; stroke-width: 2; fill: none; }
          .pill { fill: #fff; stroke-width: 1.6; }
          .ptl  { font: 700 14px "Segoe UI", sans-serif; text-anchor: middle; }
          .pcap { font: 12px "Segoe UI", sans-serif; fill: #55636f; text-anchor: middle; }
          .orlb { font: italic 13px "Segoe UI", sans-serif; fill: #8b9aab; text-anchor: middle; }
        </style>
      </defs>

      <!-- ================= row 1 ================= -->

      <!-- 1 : the one piece of genuine setup -->
      <rect class="box" x="40" y="30" width="330" height="175" rx="12" />
      <circle cx="205" cy="30" r="19" fill="#1f6feb" />
      <text class="num" x="205" y="36">1</text>
      <text class="ttl" x="205" y="86">Connect a phone</text>
      <text class="cap" x="205" y="120">Plug in a real phone and choose</text>
      <text class="cap" x="205" y="141">the app you want tested.</text>

      <line class="conn" x1="374" y1="117" x2="411" y2="117" marker-end="url(#arrow)" />

      <!-- 2 -->
      <rect class="box" x="415" y="30" width="330" height="175" rx="12" />
      <circle cx="580" cy="30" r="19" fill="#1a7f4b" />
      <text class="num" x="580" y="36">2</text>
      <text class="ttl" x="580" y="86">It explores itself</text>
      <text class="cap" x="580" y="120">The app opens and taps through</text>
      <text class="cap" x="580" y="141">its own screens, with nobody</text>
      <text class="cap" x="580" y="162">driving it.</text>

      <line class="conn" x1="749" y1="117" x2="786" y2="117" marker-end="url(#arrow)" />

      <!-- 3 : the asset the rest is built on -->
      <rect class="box" x="790" y="30" width="330" height="175" rx="12" />
      <circle cx="955" cy="30" r="19" fill="#1a7f4b" />
      <text class="num" x="955" y="36">3</text>
      <text class="ttl" x="955" y="86">A map is built</text>
      <text class="cap" x="955" y="120">Every screen, button and field</text>
      <text class="cap" x="955" y="141">is recorded and photographed.</text>

      <!-- wrap from the end of row 1 round to the start of row 2 -->
      <path class="conn" d="M 955 207 V 232 Q 955 248 939 248 H 221 Q 205 248 205 264 V 286"
            marker-end="url(#arrow)" />

      <!-- ================= row 2 ================= -->

      <!-- 4 : two routes in, one result out -->
      <rect class="box" x="40" y="290" width="330" height="195" rx="12" />
      <circle cx="205" cy="290" r="19" fill="#1a7f4b" />
      <text class="num" x="205" y="296">4</text>
      <text class="ttl" x="205" y="342">Tests are created</text>

      <rect class="pill" x="62" y="360" width="286" height="50" rx="9" stroke="#1a7f4b" />
      <text class="ptl" x="205" y="383" fill="#1a7f4b">Written for you</text>
      <text class="pcap" x="205" y="401">sign-in, sign-up and menus</text>

      <text class="orlb" x="205" y="425">or</text>

      <rect class="pill" x="62" y="434" width="286" height="50" rx="9" stroke="#1f6feb" />
      <text class="ptl" x="205" y="457" fill="#1f6feb">Described by you</text>
      <text class="pcap" x="205" y="475">a journey typed in a spreadsheet</text>

      <line class="conn" x1="374" y1="387" x2="411" y2="387" marker-end="url(#arrow)" />

      <!-- 5 -->
      <rect class="box" x="415" y="290" width="330" height="195" rx="12" />
      <circle cx="580" cy="290" r="19" fill="#1a7f4b" />
      <text class="num" x="580" y="296">5</text>
      <text class="ttl" x="580" y="346">Tests run</text>
      <text class="cap" x="580" y="380">The tests play out on the phone</text>
      <text class="cap" x="580" y="401">by themselves — on one phone,</text>
      <text class="cap" x="580" y="422">or on several at the same time.</text>

      <line class="conn" x1="749" y1="387" x2="786" y2="387" marker-end="url(#arrow)" />

      <!-- 6 -->
      <rect class="box" x="790" y="290" width="330" height="195" rx="12" />
      <circle cx="955" cy="290" r="19" fill="#1a7f4b" />
      <text class="num" x="955" y="296">6</text>
      <text class="ttl" x="955" y="346">You get a report</text>
      <text class="cap" x="955" y="380">Which tests passed, which</text>
      <text class="cap" x="955" y="401">failed, and a screenshot of the</text>
      <text class="cap" x="955" y="422">app at every single step.</text>
    </svg>
  </div>

  <div class="foot">
    All of it is driven from one web page. A person is involved twice — choosing the app, and optionally
    describing a journey to test. Everything else runs on its own.
  </div>

</section>

</body>
</html>
